
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pricing Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 30px;
}

.pricing-container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.pricing {
  width: 100%;
  max-width: 300px;
  background-color: #fff;
  box-shadow: 0 0 10px #ccc;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.price {
  font-size: 20px;
  color: green;
}

.features {
  list-style: none;
  padding-left: 0;
}

.features li {
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.btn {
  background: blue;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 5px;
  margin-top: 15px;
  cursor: pointer;
}

.btn:hover {
  background: darkblue;
}

@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  .pricing-container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<main>
  <div class="pricing-container" id="cards"></div>
</main>

<script>

function Card(title, price, features) {

  const card = document.createElement("section");
  card.className = "pricing";

  const heading = document.createElement("h2");
  heading.className = "title";
  heading.textContent = title;

  const priceElement = document.createElement("p");
  priceElement.className = "price";
  priceElement.textContent = price;

  const list = document.createElement("ul");
  list.className = "features";

  features.forEach(feature => {
    const item = document.createElement("li");
    item.textContent = feature;
    list.appendChild(item);
  });

  const button = document.createElement("button");
  button.className = "btn";
  button.type = "button";
  button.textContent = "Start Trial";

  button.addEventListener("click", function() {
    alert("You selected the " + title + "!");
  });

  card.appendChild(heading);
  card.appendChild(priceElement);
  card.appendChild(list);
  card.appendChild(button);

  return card;
}

const container = document.getElementById("cards");

container.appendChild(
  Card("Basic Plan", "$9.99 /month", [
    "1 GB Storage",
    "Basic Support",
    "All Core Features"
  ])
);

container.appendChild(
  Card("Pro Plan", "$19.99 /month", [
    "10 GB Storage",
    "Priority Support",
    "All Core Features"
  ])
);

</script>

</body>
</html>
